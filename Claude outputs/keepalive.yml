# Visita la app cada 10 minutos para que Render (plan gratis) no la duerma.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servicio
        run: curl -fsS --retry 3 --max-time 90 https://calculadora-estadistica-xc2w.onrender.com/api/health
